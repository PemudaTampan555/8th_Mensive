    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #000;
            color: white;
        }

        /* Layar Awal (Tombol Love) */
        #awal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: black;
            z-index: 100;
            transition: opacity 1s ease;
        }

        .btn-love {
            background: none;
            border: 2px solid white;
            border-radius: 50%;
            width: 80px; height: 80px;
            font-size: 30px;
            cursor: pointer;
            color: red;
            background-color: white;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
            animation: pulse 1.5s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Layar Utama (Background Foto) */
        #utama {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            /* Latar Belakang PNG */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.png') center/cover;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* Styling Container GIF */
        #avatar-container {
            width: 140px;
            height: 140px;
            background-color: rgba(255,255,255,0.9);
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 5px;
        }

        .gif-wrapper {
            width: 100%;
            display: none; /* Disembunyikan dulu semuanya */
        }

        #teks-container {
            font-size: 22px;
            font-weight: bold;
            min-height: 60px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px black;
        }

        /* Styling Khusus Untuk Surat Bucin Panjang */
        #pesan-akhir {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px black;
            line-height: 1.5;
            display: none;
            max-height: 45vh; /* Agar bisa discroll kalau kepanjangan */
            overflow-y: auto; 
            padding: 15px;
            background: rgba(0,0,0,0.4); /* Kotak transparan */
            border-radius: 10px;
            text-align: left;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(2px);
        }

        /* Modifikasi Scrollbar biar Estetik */
        #pesan-akhir::-webkit-scrollbar { width: 6px; }
        #pesan-akhir::-webkit-scrollbar-thumb { background: pink; border-radius: 10px; }
        #pesan-akhir::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        /* Game Memory */
        #game-board {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .card {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.3s;
            transform-style: preserve-3d;
        }

        .card .emoji { display: none; }
        .card.flipped { background-color: rgba(255, 255, 255, 0.9); transform: rotateY(180deg); }
        .card.flipped .emoji { display: block; transform: rotateY(180deg); }
        .card.matched { background-color: rgba(255, 255, 255, 0.9); cursor: default; }
        .card.matched .emoji { display: block; transform: rotateY(180deg); }

        /* Animasi Hati Terbang */
        .heart-float {
            position: absolute;
            bottom: -10%;
            font-size: 24px;
            color: rgba(255, 192, 203, 0.8);
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <script>
        const emojis = ['💖', '🐒', '🥰', '👽', '👻', '😸', '🤡', '🤖'];
        let cards = [...emojis, ...emojis];
        let flippedCards = [];
        let matchedPairs = 0;

        const awalScreen = document.getElementById('awal');
        const utamaScreen = document.getElementById('utama');
        const teksContainer = document.getElementById('teks-container');
        const gameBoard = document.getElementById('game-board');
        const pesanAkhir = document.getElementById('pesan-akhir');

        // Fungsi untuk ganti GIF
        function gantiGif(idGif) {
            document.getElementById('gif1').style.display = 'none';
            document.getElementById('gif2').style.display = 'none';
            document.getElementById('gif3').style.display = 'none';
            document.getElementById('gif4').style.display = 'none';
            
            document.getElementById(idGif).style.display = 'block';
        }

        async function ketikTeks(teks, delay = 100) {
            teksContainer.innerHTML = "";
            for (let i = 0; i < teks.length; i++) {
                if(teks.charAt(i) === '\n') {
                    teksContainer.innerHTML += "<br>";
                } else {
                    teksContainer.innerHTML += teks.charAt(i);
                }
                await new Promise(r => setTimeout(r, delay));
            }
        }

        // Fungsi khusus ngetik surat panjang supaya tag <br> tidak rusak
        async function ngetikSurat(htmlText, delay = 20) {
            pesanAkhir.innerHTML = "";
            let isTag = false;
            let text = "";
            for (let i = 0; i < htmlText.length; i++) {
                let char = htmlText.charAt(i);
                if (char === '<') isTag = true;
                text += char;
                pesanAkhir.innerHTML = text;
                
                // Auto scroll ke bawah tiap ada teks baru
                pesanAkhir.scrollTop = pesanAkhir.scrollHeight;
                
                if (char === '>') isTag = false;
                if (!isTag) await new Promise(r => setTimeout(r, delay));
            }
        }

        async function mulai() {
            awalScreen.style.opacity = "0";
            setTimeout(() => {
                awalScreen.style.display = "none";
                utamaScreen.style.display = "flex";
                jalankanSkenario();
            }, 1000);
        }

        async function jalankanSkenario() {
            gantiGif('gif1');
            await ketikTeks("Haaaayy imuuuup", 100);
            await new Promise(r => setTimeout(r, 1500));
            
            await ketikTeks("Akuuu ada sesuatu buat kamuu sayaaaang", 80);
            await new Promise(r => setTimeout(r, 1500));

            gantiGif('gif2');
            await ketikTeks("Coba kamuu selesaikan\nGame iniyaaa imuuuup", 80);
            await new Promise(r => setTimeout(r, 1000));

            teksContainer.style.display = "none";
            inisialisasiGame();
        }

        function inisialisasiGame() {
            gameBoard.style.display = "grid";
            gameBoard.innerHTML = "";
            cards.sort(() => Math.random() - 0.5);

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                
                const span = document.createElement('span');
                span.classList.add('emoji');
                span.innerText = emoji;
                
                card.appendChild(span);
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (flippedCards.length >= 2) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                cekKecocokan();
            }
        }

        function cekKecocokan() {
            const [card1, card2] = flippedCards;

            if (card1.dataset.emoji === card2.dataset.emoji) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];

                if (matchedPairs === emojis.length) {
                    setTimeout(gameSelesai, 1000);
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 800);
            }
        }

        async function gameSelesai() {
            gameBoard.style.display = "none";
            teksContainer.style.display = "block";

            gantiGif('gif3');
            await ketikTeks("Cieee pinternyaaa dyaaaaa <3", 100);
            await new Promise(r => setTimeout(r, 1500));

            await ketikTeks("Tunggu bentar yaaaayy sayaaaang", 100);
            await new Promise(r => setTimeout(r, 1500));
            
            teksContainer.style.display = "none";
            mulaiPesanPanjang();
        }

        async function mulaiPesanPanjang() {
            gantiGif('gif4');
            pesanAkhir.style.display = "block";
            
            // Hujan Hati mulai jalan pas suratnya lagi diketik
            setInterval(buatHati, 300);

            // Nge-tik dengan kecepatan 20ms biar gak terlalu lama
            await ngetikSurat(suratCinta, 20);
        }

        function buatHati() {
            const heart = document.createElement('div');
            heart.classList.add('heart-float');
            heart.innerText = '♡';
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 2 + 3) + "s";
            
            document.getElementById('utama').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
    </script>
